name: Collect and predict

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanguo-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect, calibrate and generate report
        env:
          WECHAT_SCTKEY: ${{ secrets.WECHAT_SCTKEY }}
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          TZ: Asia/Shanghai
        run: |
          python scripts/collect_defense_data.py
          python scripts/calibrate_collected_data.py
          python scripts/daily_defense_summary.py

      - name: Save generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update collected prediction data"
            git push
          fi
